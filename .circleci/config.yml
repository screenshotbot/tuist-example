
# .circleci/config.yml

version: 2.1

commands:
  setup:
    description: >
      Install the Ruby and Tuist toolchains. Tuist is pinned in .mise.toml and
      installed with mise; `bundle exec fastlane generate` then turns
      Project.swift into SimpleProject.xcworkspace.
    steps:
      - checkout
      - run:
          name: Install mise
          command: |
            curl https://mise.run | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install Tuist
          command: |
            mise trust
            mise install
      - run: bundle install

jobs:
  build-and-test:
    macos:
      xcode: 16.4
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: screenshotbot_ci
    resource_class: m4pro.medium
    steps:
      - setup
      - run:
          name: Fastlane
          no_output_timeout: 30m
          command: bundle exec fastlane $FASTLANE_LANE
      - store_artifacts:
          path: output
      - store_test_results:
          path: output/scan

  adhoc:
    macos:
      xcode: 16.4
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: adhoc
    resource_class: m4pro.medium
    steps:
      - setup
      - run:
          name: Fastlane
          no_output_timeout: 30m
          command: bundle exec fastlane $FASTLANE_LANE
      - store_artifacts:
          path: output

workflows:
  build-test-adhoc:
    jobs:
      - build-and-test
      - adhoc:
          filters:
            branches:
              only: development
          requires:
            - build-and-test
