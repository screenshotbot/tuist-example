
# .circleci/config.yml

version: 2.1

commands:
  setup:
    description: >
      Install the Ruby and Tuist toolchains. Tuist is pinned in .mise.toml and
      installed with mise; `bundle exec fastlane generate` then turns
      Project.swift into SimpleProject.xcworkspace.
    steps:
      - checkout
      - run:
          name: Install mise
          command: |
            curl https://mise.run | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install Tuist
          command: |
            mise trust
            # Only tuist: .mise.toml also pins a Ruby for local machines, but
            # this image already ships 3.4.3 via rbenv and building another one
            # here would cost minutes for nothing.
            mise install tuist
      - run: bundle install

jobs:
  build-and-test:
    macos:
      xcode: 16.4
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: screenshotbot_ci
      # Opts this job into tuist.dev, which is what lets selective testing
      # share hashes between runs. Pairs with TUIST_TOKEN, set as a
      # project-level environment variable in the CircleCI UI — without a
      # token, a project with a full handle refuses to generate.
      TUIST_FULL_HANDLE: screenshotbot/tuist-example
    resource_class: m4pro.medium
    steps:
      - setup
      - run:
          name: Fastlane
          no_output_timeout: 30m
          command: bundle exec fastlane $FASTLANE_LANE
      # `tuist test` writes an .xcresult rather than the JUnit XML that
      # store_test_results wants, so the result bundle is kept as an artifact.
      - store_artifacts:
          path: output

  adhoc:
    macos:
      xcode: 16.4
    environment:
      FL_OUTPUT_DIR: output
      FASTLANE_LANE: adhoc
    resource_class: m4pro.medium
    steps:
      - setup
      - run:
          name: Fastlane
          no_output_timeout: 30m
          command: bundle exec fastlane $FASTLANE_LANE
      - store_artifacts:
          path: output

workflows:
  build-test-adhoc:
    jobs:
      - build-and-test
      - adhoc:
          filters:
            branches:
              only: development
          requires:
            - build-and-test
